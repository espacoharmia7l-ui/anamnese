<style>
:root{
  --bg:#F5F0F6; --surface:#FFFFFF; --ink:#2A1F30; --muted:#6E6474;
    --line:#E2D7E6; --brand:#6B447D; --brand-ink:#FFFFFF; --soft:#EAE1ED;
    --alert:#8A3B2E; --alert-bg:#F6E6E1; --focus:#6A826B; --logo-a:#6B447D; --logo-b:#6A826B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1623; --surface:#2A2030; --ink:#F1EAF3; --muted:#B7A9BD;
    --line:#3F3246; --brand:#DEF3D9; --brand-ink:#2A1F30; --soft:#33283A;
    --alert:#F0A796; --alert-bg:#3A231E; --focus:#A9C4A6; --logo-a:#DEF3D9; --logo-b:#A9C4A6;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1623; --surface:#2A2030; --ink:#F1EAF3; --muted:#B7A9BD;
    --line:#3F3246; --brand:#DEF3D9; --brand-ink:#2A1F30; --soft:#33283A;
    --alert:#F0A796; --alert-bg:#3A231E; --focus:#A9C4A6; --logo-a:#DEF3D9; --logo-b:#A9C4A6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px}
.brandline{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.brandline b{color:var(--ink);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .35s ease}
h1{font-family:"Jost","Figtree",system-ui,sans-serif;font-weight:300;font-size:40px;line-height:1.05;margin:28px 0 10px;letter-spacing:-.01em}
h2{font-family:"Jost","Figtree",system-ui,sans-serif;font-weight:300;font-size:28px;line-height:1.15;margin:24px 0 6px}
.lead{color:var(--muted);margin:0 0 8px;max-width:46ch}
.logo{display:block;height:120px;width:auto;margin:28px auto 4px}
.logo .lg-a{fill:var(--logo-a)} .logo .lg-b{fill:var(--logo-b)}
h1.center{text-align:center;margin-top:18px}
.lead.center{text-align:center;margin-left:auto;margin-right:auto}
.field{margin:26px 0 0}
.field>.lbl{display:block;font-weight:600;margin-bottom:8px;line-height:1.35}
.field .hint{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.req{color:var(--brand);margin-left:2px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;
  -webkit-appearance:none;appearance:none;min-height:50px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{border-color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;padding:10px 15px;border:1.5px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:15px;line-height:1.3;user-select:none;transition:background .15s,border-color .15s}
.opt input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt input:focus-visible+span,.agree input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.opts.stack{flex-direction:column}
.opts.stack .opt span{border-radius:12px;width:100%}
.opts.stack .opt{width:100%}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale .opt span{padding:10px 0;width:100%;text-align:center;border-radius:10px;font-variant-numeric:tabular-nums}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.agree{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--surface);cursor:pointer}
.agree input{position:absolute;opacity:0;width:1px;height:1px}
.agree .box{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:6px;margin-top:1px;display:grid;place-items:center}
.agree input:checked~.box{background:var(--brand);border-color:var(--brand)}
.agree input:checked~.box::after{content:"";width:6px;height:11px;border:solid var(--brand-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.agree .txt{font-weight:400;line-height:1.45}
.err{display:none;color:var(--alert);font-size:14px;margin-top:6px}
.field.invalid .err{display:block}
.field.invalid input[type=text],.field.invalid input[type=tel],.field.invalid input[type=email],.field.invalid input[type=date],.field.invalid textarea,.field.invalid .agree{border-color:var(--alert)}
[hidden]{display:none!important}
.note{background:var(--alert-bg);color:var(--alert);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:22px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:600;border-radius:12px;padding:14px 18px;min-height:52px;cursor:pointer;border:1.5px solid transparent}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{flex:1;background:var(--brand);color:var(--brand-ink)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.summary{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 16px 12px;margin-top:20px}
.summary h3{font-family:"Jost","Figtree",system-ui,sans-serif;font-weight:300;font-size:19px;margin:18px 0 6px}
.summary dl{margin:0}
.summary dt{color:var(--muted);font-size:14px;margin-top:8px}
.summary dd{margin:0;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.actions a{text-decoration:none;text-align:center;display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
#fallback{width:100%;min-height:200px;margin-top:12px;font-size:13px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const yes = (id)=> s => s[id] === "Sim";
const idade = s => {
  if(!s.nascimento) return null;
  const d = new Date(s.nascimento + "T12:00:00"); if(isNaN(d)) return null;
  const n = new Date(); let a = n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) a--;
  return a;
};

  {id:"sono_qualidade", label:"Como é seu sono?", hint:"Pode marcar mais de um", type:"checks", req:true, options:["Durmo bem e acordo descansado","Demoro a pegar no sono","Acordo várias vezes à noite","Acordo cansado","Ronco ou tenho apneia","Durmo em horários irregulares"]},
  {id:"estresse", label:"Seu nível de estresse no dia a dia", type:"radio", options:["Baixo","Moderado","Alto"]},
  {id:"alimentacao_tipo", label:"Qual o seu tipo de alimentação?", type:"radio", req:true, options:["Como de tudo","Vegetariana","Vegana","Low carb ou cetogênica","Com restrição (intolerância, alergia)","Outra"]},
  {id:"alimentacao_tipo_desc", label:"Conte um pouco mais", type:"text", show:s=>["Com restrição (intolerância, alergia)","Outra"].includes(s.alimentacao_tipo)},
  {id:"refeicoes", label:"Quantas refeições faz por dia?", type:"radio", options:["1 a 2","3 a 4","5 ou mais"]},
  {id:"alimentacao", label:"Como avalia sua alimentação?", type:"radio", options:["Equilibrada","Regular","Desregulada"]},
  {id:"acompanhamento_nutri", label:"Tem acompanhamento com nutricionista?", type:"yesno"},
  {id:"agua", label:"Quanta água bebe por dia?", type:"radio", options:["Menos de 1 litro","1 a 2 litros","Mais de 2 litros"]},
 ]},
 { id:"termo", title:"Termo e consentimento", intro:"Último passo. Leia e confirme.", fields:[
  {id:"t_verdade", type:"agree", req:true, text:"Declaro que as informações acima são verdadeiras e que vou avisar o studio sobre qualquer mudança no meu estado de saúde."},
  {id:"t_limites", type:"agree", req:true, text:"Estou ciente de que devo respeitar meus limites durante as aulas e avisar o professor se sentir dor, tontura ou mal-estar."},
  {id:"t_lgpd", type:"agree", req:true, text:"Autorizo o Espaço Harmia a guardar estes dados, inclusive os de saúde, somente para planejar e acompanhar meus treinos, conforme a LGPD (Lei 13.709/2018)."},
  {id:"responsavel", label:"Nome completo do responsável legal", hint:"Obrigatório para menores de 18 anos", type:"text", req:true, show:s=>{const a=idade(s);return a!==null && a<18;}},
  {id:"assinatura", label:"Assinatura", hint:"Digite seu nome completo", type:"text", req:true},
 ]},
];

let state = {}; let step = 0;
try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const o = JSON.parse(raw); state = o.state||{}; step = Math.min(o.step||0, STEPS.length); } }catch(e){}
const save = ()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify({state, step})); }catch(e){} };

const app = document.getElementById("app");
const esc = t => String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const visible = f => !f.show || f.show(state);
const filled = v => Array.isArray(v) ? v.length>0 : (v!==undefined && v!==null && String(v).trim()!=="" && v!==false);

function fieldHTML(f){
  const v = state[f.id];
  const name = esc(f.id);
  const lbl = f.label ? `<span class="lbl" id="l_${name}">${esc(f.label)}${f.req?'<span class="req" aria-hidden="true">*</span>':''}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</span>` : "";
  let body = "";
  if(["text","tel","email","date"].includes(f.type)){
    body = `<input type="${f.type}" id="f_${name}" name="${name}" value="${esc(v||"")}" ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""} ${f.auto?`autocomplete="${f.auto}"`:""} ${f.type==="tel"?'inputmode="tel"':""} ${f.max?`max="${f.max}"`:""} aria-labelledby="l_${name}">`;
  } else if(f.type==="textarea"){
    body = `<textarea id="f_${name}" name="${name}" aria-labelledby="l_${name}">${esc(v||"")}</textarea>`;
  } else if(f.type==="radio" || f.type==="yesno"){
    const opts = f.type==="yesno" ? ["Sim","Não"] : f.options;
    const stack = f.type==="radio" && opts.some(o=>o.length>22);
    body = `<div class="opts${stack?' stack':''}" role="radiogroup" aria-labelledby="l_${name}">` + opts.map(o=>
      `<label class="opt"><input type="radio" name="${name}" value="${esc(o)}" ${v===o?"checked":""}><span>${esc(o)}</span></label>`).join("") + `</div>`;
  } else if(f.type==="checks"){
    const arr = Array.isArray(v)?v:[];
    body = `<div class="opts" role="group" aria-labelledby="l_${name}">` + f.options.map(o=>
      `<label class="opt"><input type="checkbox" name="${name}" value="${esc(o)}" ${arr.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("") + `</div>`;
  } else if(f.type==="scale"){
    body = `<div class="scale opts" role="radiogroup" aria-labelledby="l_${name}">` + Array.from({length:11},(_,i)=>
      `<label class="opt"><input type="radio" name="${name}" value="${i}" ${String(v)===String(i)?"checked":""}><span>${i}</span></label>`).join("") +
      `</div><div class="scale-ends"><span>${esc(f.ends[0])}</span><span>${esc(f.ends[1])}</span></div>`;
  } else if(f.type==="agree"){
    body = `<label class="agree"><input type="checkbox" name="${name}" ${v?"checked":""}><span class="box" aria-hidden="true"></span><span class="txt">${esc(f.text)}</span></label>`;
  }
  const errMsg = f.id==="nascimento" ? "Confira a data de nascimento." : f.type==="agree" ? "Confirme para continuar." : (f.type==="checks"||f.type==="radio"||f.type==="yesno"||f.type==="scale") ? "Escolha uma opção." : "Preencha este campo.";
  return `<div class="field" data-field="${name}" ${visible(f)?"":"hidden"}>${lbl}${body}<div class="err">${errMsg}</div></div>`;
}

function renderStep(){
  const s = STEPS[step];
  document.getElementById("stepCount").textContent = `Etapa ${step+1} de ${STEPS.length}`;
  document.getElementById("barFill").style.width = (step/STEPS.length*100)+"%";
  app.innerHTML = (step===0?`${LOGO}<h1 class="center">Anamnese</h1>`:"") + `<h2>${esc(s.title)}</h2><p class="lead">${esc(s.intro)}</p>` +
    s.fields.map(fieldHTML).join("") + `<div class="note" id="stepNote" hidden></div>`;
  document.getElementById("backBtn").hidden = step===0;
  document.getElementById("nextBtn").textContent = step===STEPS.length-1 ? "Revisar respostas" : "Continuar";
  document.getElementById("nav").hidden = false;
  refresh();
}

function refresh(){
  const s = STEPS[step]; if(!s) return;
  s.fields.forEach(f=>{
    const el = app.querySelector(`[data-field="${f.id}"]`);
    if(el) el.hidden = !visible(f);
  });
  const n = document.getElementById("stepNote");
  if(n){ const t = s.note ? s.note(state) : ""; n.hidden = !t; n.textContent = t; }
}

app.addEventListener("input", onChange);
app.addEventListener("change", onChange);
function onChange(e){
  const t = e.target; if(!t.name) return;
  const f = STEPS[step]?.fields.find(x=>x.id===t.name); if(!f) return;
  if(f.type==="checks"){
    let arr = Array.from(app.querySelectorAll(`input[name="${t.name}"]:checked`)).map(i=>i.value);
    if(f.none && e.type==="change"){
      if(t.value===f.none && t.checked){ arr=[f.none]; }
      else if(t.checked){ arr = arr.filter(x=>x!==f.none); }
      app.querySelectorAll(`input[name="${t.name}"]`).forEach(i=>i.checked = arr.includes(i.value));
    }
    state[f.id] = arr;
    const other = {gosta:"nao_gosta", nao_gosta:"gosta"}[f.id];
    if(other && t.checked && Array.isArray(state[other]) && state[other].includes(t.value)){
      state[other] = state[other].filter(x=>x!==t.value);
      app.querySelectorAll(`input[name="${other}"]`).forEach(i=>{ if(i.value===t.value) i.checked=false; });
    }
  } else if(f.type==="agree"){ state[f.id] = t.checked; }
  else { state[f.id] = t.value; }
  const wrap = t.closest(".field"); if(wrap && filled(state[f.id])) wrap.classList.remove("invalid");
  refresh(); save();
}

function validate(){
  let first = null;
  STEPS[step].fields.forEach(f=>{
    const el = app.querySelector(`[data-field="${f.id}"]`);
    let bad = f.req && visible(f) && !filled(state[f.id]);
    if(!bad && f.id==="nascimento"){ const a = idade(state); bad = a===null || a<5 || a>100; }
    el.classList.toggle("invalid", bad);
    if(bad && !first) first = el;
  });
  if(first){ first.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); const i=first.querySelector("input,textarea"); if(i && ["text","tel","email","date","textarea"].includes(i.type||i.tagName.toLowerCase())) i.focus({preventScroll:true}); }
  return !first;
}

document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(!validate()) return;
  step++; save();
  if(step>=STEPS.length) renderSummary(); else renderStep();
  window.scrollTo(0,0);
});
document.getElementById("backBtn").addEventListener("click", ()=>{
  if(step>0){ step--; save(); renderStep(); window.scrollTo(0,0); }
});

function fmt(f, v){
  if(Array.isArray(v)) return v.join(", ");
  if(f.type==="date"){ const [y,m,d]=String(v).split("-"); const a=idade(state); return `${d}/${m}/${y}` + (a!==null?` (${a} anos)`:""); }
  if(f.type==="scale") return `${v}/10`;
  if(f.type==="agree") return v ? "Confirmado" : "";
  return String(v);
}
function alerts(){
  const a = [];
  if([1,2,3,4,5,6,7].some(i=>state["parq"+i]==="Sim")) a.push("PAR-Q com resposta \"sim\": avaliar liberação médica");
  if(state.gestacao && state.gestacao!=="Não estou grávida" && state.sexo==="Feminino") a.push(state.gestacao);
  if(state.dor==="Sim" && Number(state.dor_intensidade)>=7) a.push(`Dor intensa (${state.dor_intensidade}/10)`);
  if(state.limitacao_fisica==="Sim") a.push("Tem limitação física");
  if(state.cronica==="Sim") a.push("Tem doença crônica");
  if(state.restricao==="Sim") a.push("Tem restrição de movimento indicada por profissional");
  return a;
}
const SHORT = {nome:"Nome",nascimento:"Nascimento",sexo:"Sexo",whatsapp:"WhatsApp",email:"E-mail",profissao:"Profissão",bairro:"Bairro",emerg_nome:"Emergência",emerg_tel:"Tel. emergência",origem:"Conheceu por",
 modalidade:"Modalidade",objetivos:"Objetivos",objetivo_principal:"Meta 3 meses",experiencia:"Já praticou",atividade_atual:"Exercita hoje",frequencia:"Pretende treinar",horario:"Horários",
 pausas:"Ritmo",gosta:"Gosta",nao_gosta:"Não gosta",preferencias_obs:"Obs.",experiencia_ruim_desc:"Experiência ruim",
 parq7_desc:"PAR-Q outro motivo",condicoes:"Condições",condicoes_outras:"Outras",cronica_desc:"Doença crônica",cirurgia_desc:"Cirurgias",implantes_desc:"Implantes",medicamentos_desc:"Medicamentos",acompanhamento_desc:"Acompanhamento",
 gestacao:"Gestação",gestacao_semanas:"Semanas",gestacao_liberacao:"Liberação médica",alergias:"Alergias",fuma:"Fuma",alcool:"Álcool",
 dor_regioes:"Dor em",dor_intensidade:"Intensidade",dor_piora:"Piora/alivia",limitacao_fisica_desc:"Limitação física",limitacao_dia:"Dificuldade no dia a dia",lesoes:"Lesões",restricao_desc:"Evitar",
 trabalho:"Trabalho",sono_horas:"Sono",sono_qualidade:"Qualidade do sono",estresse:"Estresse",alimentacao_tipo:"Alimentação",alimentacao_tipo_desc:"Detalhe",refeicoes:"Refeições/dia",alimentacao:"Avalia alimentação",acompanhamento_nutri:"Nutricionista",agua:"Água",
 responsavel:"Responsável",assinatura:"Assinatura"};

const ICON = {pessoal:"👤",objetivos:"🎯",preferencias:"💪",parq:"❤️",saude:"🩺",dores:"🦴",rotina:"🌙",termo:"✍️"};
function buildText(){
  const nome = (state.nome||"").trim();
  const L = [`📋 *ANAMNESE · ESPAÇO HARMIA*`, nome ? `*${nome}*` : "", `_Preenchida em ${new Date().toLocaleDateString("pt-BR")}_`].filter(Boolean);
  const parqSim = [1,2,3,4,5,6,7].filter(i=>state["parq"+i]==="Sim");
  const al = alerts();
  if(al.length){ L.push("", "⚠️ *ATENÇÃO*"); al.forEach(x=>L.push("- "+x)); }
  STEPS.forEach(s=>{
    if(s.id==="termo") return;
    const rows = s.fields.filter(f=>visible(f) && filled(state[f.id]) && f.type!=="agree" && f.type!=="yesno" && !/^parq\d$/.test(f.id) && !(s.id==="pessoal" && f.id==="nome"));
    const extra = [];
    if(s.id==="parq") extra.push(parqSim.length ? `Respondeu *sim* nas perguntas ${parqSim.join(", ")}` : "Respondeu *não* a todas");
    if(!rows.length && !extra.length) return;
    L.push("", `${ICON[s.id]||""} *${s.title.toUpperCase()}*`);
    extra.forEach(x=>L.push(x));
    rows.forEach(f=>{
      const v = state[f.id]; const lab = SHORT[f.id]||f.label;
      if(Array.isArray(v) && v.length>1){ L.push(`*${lab}:*`); v.forEach(x=>L.push("- "+x)); }
      else L.push(`*${lab}:* ${fmt(f,v)}`);
    });
  });
  L.push("", "✍️ *TERMO*", `Assinado por: ${state.assinatura||""}` + (state.responsavel?`\nResponsável: ${state.responsavel}`:""), "Termos e LGPD aceitos", "", "_Perguntas de sim/não que não aparecem = não_");
  return L.join("\n");
}
const WA_MAX = 1800;

function renderSummary(){
  document.getElementById("stepCount").textContent = "Revisão";
  document.getElementById("barFill").style.width = "100%";
  document.getElementById("nav").hidden = true;
  const al = alerts();
  const txt = buildText();
  const full = `https://api.whatsapp.com/send?phone=${WHATSAPP_STUDIO}&text=${encodeURIComponent(txt)}`;
  let html = `${LOGO.replace('class="logo"','class="logo" style="height:84px"')}<h2>Confira suas respostas</h2><p class="lead">Se estiver tudo certo, envie para o studio pelo WhatsApp.</p>`;
  if(al.length) html += `<div class="note">${al.map(esc).join("<br>")}</div>`;
  html += `<div class="summary">` + STEPS.filter(s=>s.id!=="termo").map(s=>{
    const rows = s.fields.filter(f=>visible(f) && filled(state[f.id]) && f.type!=="agree");
    if(!rows.length) return "";
    return `<h3>${esc(s.title)}</h3><dl>` + rows.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(fmt(f,state[f.id]))}</dd>`).join("") + `</dl>`;
  }).join("") + `<h3>Termo</h3><dl><dt>Assinado por</dt><dd>${esc(state.assinatura||"")}${state.responsavel?`\nResponsável: ${esc(state.responsavel)}`:""}</dd></dl></div>`;
  html += `<div class="actions">
      <a class="primary" href="${full}" target="_blank" rel="noopener" style="padding:14px 18px;border-radius:12px;font-weight:600">Enviar pelo WhatsApp</a>
      <button type="button" class="ghost" id="editBtn">Editar respostas</button></div>
    <p class="lead" style="font-size:14px;margin-top:18px;text-align:center">O WhatsApp não abriu com as respostas? <button type="button" id="copyBtn" style="all:unset;cursor:pointer;color:var(--brand);font-weight:600;text-decoration:underline">Copie aqui</button> e cole na conversa com o studio.</p>`;
  html += `<textarea id="fallback" hidden readonly aria-label="Respostas para copiar"></textarea>`;
  app.innerHTML = html;
  document.getElementById("editBtn").onclick = ()=>{ step = 0; save(); renderStep(); window.scrollTo(0,0); };
  document.getElementById("copyBtn").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(txt); toast("Respostas copiadas"); }
    catch(e){
      const ta=document.getElementById("fallback"); ta.hidden=false; ta.value=txt; ta.focus(); ta.select();
      try{ if(document.execCommand("copy")) { toast("Respostas copiadas"); return; } }catch(_){}
      toast("Selecione o texto e copie");
    }
  };
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }

if(step>=STEPS.length) renderSummary(); else renderStep();
</script>
